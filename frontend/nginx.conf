server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse proxy: forward every /api request to the backend container.
    # Containers on the same Docker network resolve each other by service
    # name, so "backend" here resolves to the backend container's IP.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router client-side routing: fall back to index.html for any
    # path that isn't a real static asset.
    location / {
        try_files $uri $uri/ /index.html;
    }
}